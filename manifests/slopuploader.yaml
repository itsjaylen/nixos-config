apiVersion: apps/v1
kind: Deployment
metadata:
  name: slopuploader
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: slopuploader
  template:
    metadata:
      labels:
        app: slopuploader
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: role
                    operator: In
                    values: ["small-services"]
      containers:
        - name: slopuploader
          image: git.itsjaylen.com/itsjaylen/slopuploader:0.2.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: BASE_URL
              value: "http://slopuploader.itsjaylen.com"
            - name: DB_TYPE
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: slopuploader-secrets
                  key: db-password
            - name: DB_CONN
              value: "host=192.168.50.188 port=5432 user=slopuploader dbname=slopuploader sslmode=disable password=$(POSTGRES_PASSWORD)"
            - name: STORAGE_TYPE
              value: "s3"
            - name: S3_ENDPOINT
              value: "http://192.168.50.188:3900"
            - name: S3_BUCKET
              value: "slopuploader-files"
            - name: S3_REGION
              value: "garageland"
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: slopuploader-secrets
                  key: s3-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: slopuploader-secrets
                  key: s3-secret-key
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: slopuploader-secrets
                  key: admin-token
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "500m"
              apiVersion: networking.k8s.io/v1
              kind: Ingress
              metadata:
                name: slopuploader-ingress
                namespace: default
              spec:
                rules:
                  - host: slopuploader.itsjaylen.com
                    http:
                      paths:
                        - path: /
                          pathType: Prefix
                          backend:
                            service:
                              name: slopuploader-svc
                              port:
                                number: 80