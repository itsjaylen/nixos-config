apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: descheduler
  namespace: flux-system
spec:
  interval: 120m
  url: https://kubernetes-sigs.github.io/descheduler
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
  namespace: kube-system
spec:
  interval: 60m
  chart:
    spec:
      chart: descheduler
      version: "0.33.0"  # It is recommended to pin the version to avoid accidental upgrades
      sourceRef:
        kind: HelmRepository
        name: descheduler
        namespace: flux-system
  values:
    # Configure core policies
    deschedulerPolicy:
      strategies:
        # This is the key strategy for solving your problem
        RemovePodsViolatingNodeAffinity:
          enabled: true
          params:
            nodeAffinityType:
              - "requiredDuringSchedulingIgnoredDuringExecution"  # Focus on this type of violation
        RemovePodsViolatingNodeTaints:
          enabled: true
        RemovePodsViolatingInterPodAntiAffinity:
          enabled: true
    # Set the execution frequency (default is every 10 minutes, can be adjusted as needed)
    schedule: "*/10 * * * *"