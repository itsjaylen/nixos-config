name: "Format Check"

on:
  push:
  pull_request:

jobs:
  treefmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30

      - name: Run treefmt via Nix
        run: nix fmt -- --fail-on-change