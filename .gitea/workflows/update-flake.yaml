name: Update flake.lock

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # Runs daily at 3:00 AM UTC

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          # Injects your GitHub Personal Access Token to bypass the 403 rate limit
          extra-nix-config: |
            access-tokens = github.com=${{ secrets.GH_ACCESS_TOKEN }}

      - name: Update flake.lock
        run: |
          git config --global user.name "Gitea Actions Bot"
          git config --global user.email "actions@gitea.local"
          
          # Run the flake update
          nix flake update

      - name: Push changes and create Pull Request
        env:
          TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          if git diff --quiet flake.lock; then
            echo "No updates available for flake.lock."
          else
            git checkout -b flake-update
            git add flake.lock
            git commit -m "flake.lock: automated daily update"
            
            # Configure remote and push branch to local Gitea instance
            git remote set-url origin http://oauth2:$TOKEN@192.168.50.123:3000/itsjaylen/nixos-config.git
            git push origin flake-update --force
            echo "Changes pushed to branch 'flake-update'."

            # Automatically create a Pull Request via Gitea API
            curl -s -X POST \
              -H "Authorization: token $TOKEN" \
              -H "Content-Type: application/json" \
              -d '{
                "base": "master",
                "head": "flake-update",
                "title": "flake.lock: automated daily update",
                "body": "Automated daily update of flake.lock via Gitea Actions."
              }' \
              http://192.168.50.123:3000/api/v1/repos/itsjaylen/nixos-config/pulls
            
            echo "Pull Request created successfully!"
          fi