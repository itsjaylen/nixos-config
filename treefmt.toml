# Set the root of the project
root-in-project = true

# Global excludes so treefmt ignores build outputs or flake locks if desired
excludes = [
  "result",
  "result-*",
]

# Clean up unused code/variables in Nix files
[formatter.deadnix]
command = "deadnix"
options = ["--edit"]
includes = ["*.nix"]

# Format Nix files (you can swap "nixfmt" for "alejandra" if you prefer)
[formatter.nix]
command = "nixfmt"
includes = ["*.nix"]

# Format TOML configuration files
[formatter.toml]
command = "taplo"
options = ["fmt"]
includes = ["*.toml"]

[formatter.go]
command = "gofmt"
options = ["-w"]
includes = ["*.go"]

[formatter.shell]
command = "shfmt"
options = ["-i", "2", "-s", "-w"]
includes = ["*.sh"]