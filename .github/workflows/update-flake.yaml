name: Update flake.lock

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # Runs daily at 3:00 AM UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Configure Nix Authentication
        run: |
          mkdir -p ~/.config/nix
          echo "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}" >> ~/.config/nix/nix.conf

      - name: Update flake.lock
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.local"
          
          nix flake update

      - name: Push changes and create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if git diff --quiet flake.lock; then
            echo "No updates available for flake.lock."
          else
            git checkout -b flake-update
            git add flake.lock
            git commit -m "flake.lock: automated daily update"
            
            git push origin flake-update --force
            echo "Changes pushed to branch 'flake-update'."

            # Automatically create a Pull Request via GitHub API
            curl -s -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d '{
                "base": "main",
                "head": "flake-update",
                "title": "flake.lock: automated daily update",
                "body": "Automated daily update of flake.lock via GitHub Actions."
              }' \
              https://api.github.com/repos/$REPO/pulls
            
            echo "Pull Request created successfully!"
          fi