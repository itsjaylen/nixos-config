name: "Auto-Format & Merge"

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v30

      - name: Run treefmt
        run: nix fmt

      - name: Check for changes, push, create PR, and merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Formatting changes detected. Creating auto-format PR..."
            
            git config --global user.name "Treefmt Bot"
            git config --global user.email "bot@github.local"
            
            BRANCH_NAME="auto-format-${{ github.run_id }}"
            git checkout -b "$BRANCH_NAME"
            git commit -am "style: auto-format codebase via treefmt"
            git push origin "$BRANCH_NAME"

            # Create Pull Request via GitHub REST API
            PR_RESPONSE=$(curl -s -X POST "https://api.github.com/repos/$REPO/pulls" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d "{
                \"head\": \"$BRANCH_NAME\",
                \"base\": \"$TARGET_BRANCH\",
                \"title\": \"style: automatic code formatting\",
                \"body\": \"Automated formatting applied via treefmt and Nix CI.\"
              }")

            PR_NUMBER=$(echo "$PR_RESPONSE" | jq -r '.number')

            if [[ "$PR_NUMBER" != "null" && -n "$PR_NUMBER" ]]; then
              echo "Created PR #$PR_NUMBER. Merging automatically..."
              
              # Merge Pull Request via GitHub REST API (using squash merge)
              curl -s -X PUT "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER/merge" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/json" \
                -d '{
                  "merge_method": "squash",
                  "commit_title": "style: automatic code formatting (squashed)"
                }'
              echo "Successfully merged formatting changes."
            else
              echo "Failed to create PR. Response: $PR_RESPONSE"
              exit 1
            fi
          else
            echo "Code is already formatted correctly. No action needed."
          fi